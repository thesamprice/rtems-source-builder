#
# tcgcov 0.1.0
#
# This configuration file make's and install's the tcgcov QEMU TCG plugin and
# its host side reporting tool.
#
# tcgcov gives non-intrusive line and branch coverage for code running under
# QEMU. A TCG plugin records the guest addresses that execute and the host
# side tool turns that, with the DWARF line table of the image, into LCOV.
# Nothing is added to the target image so RTEMS tests are measured as they
# are built and run.
#
# The LCOV output is rendered to HTML by genhtml, from the lcov package. That
# is a report time tool, not a build or run time one: coverage is collected and
# the .info files are produced without it. It is therefore checked as an
# optional host tool, %{__genhtml} in defaults.mc, so a host without lcov still
# passes sb-check and can still build this package and collect coverage.
#

%if %{release} == %{nil}
%define release 1
%endif

%include %{_configdir}/base.cfg

%define tcgcov_version 0.1.0

Name:      tcgcov-%{tcgcov_version}-%{_host}-%{release}
Summary:   tcgcov v%{tcgcov_version} QEMU coverage plugin for host %{_host}
Version:   %{tcgcov_version}
Release:   %{release}
URL:       https://github.com/thesamprice/tcgcov

#
# Source
#
%source set tcgcov --rsb-file=tcgcov-%{tcgcov_version}.tar.gz \
    https://github.com/thesamprice/tcgcov/archive/refs/tags/v%{tcgcov_version}.tar.gz
%hash sha512 tcgcov-%{tcgcov_version}.tar.gz \
    8XmXmgxGq39dKXKhWpaz8fUXplCxZsfDGSTK7AnYpGubLTeDzA+HbLAxlOvqJoasTnmb91X3Y+Ajjz88vcUaNQ==

#
# Prepare the source code.
#
%prep
  build_top=$(pwd)

  %source setup tcgcov -q -n tcgcov-%{tcgcov_version}
  %patch setup tcgcov -p1

  cd ${build_top}

%build
  build_top=$(pwd)

  cd tcgcov-%{tcgcov_version}

  %{host_build_flags}

  SYSROOT=$SB_TMPPREFIX

  #
  # QEMU installs its plugin header flat as '<prefix>/include/qemu-plugin.h'
  # so the plugin can be built without a configured QEMU tree. Prefer the
  # staged header of the QEMU built by this build set and fall back to a QEMU
  # already installed under the prefix.
  #
  # The plugin API is versioned with QEMU_PLUGIN_VERSION and QEMU refuses to
  # load a plugin built against a different version, so the plugin must be
  # built against the QEMU it is loaded into. Do not carry a plugin built
  # here to another QEMU install.
  #
  qemu_plugin_h="${SYSROOT}/include/qemu-plugin.h"
  if test ! -f "${qemu_plugin_h}"; then
    qemu_plugin_h="%{_includedir}/qemu-plugin.h"
  fi
  if test ! -f "${qemu_plugin_h}"; then
    echo "error: qemu-plugin.h not found, build the QEMU build set first" 1>&2
    exit 1
  fi

  #
  # The plugin's Makefile appends to CFLAGS and LDFLAGS so they are passed in
  # the environment and not as make arguments, which would override them and
  # drop the -fPIC, the glib flags and the discontinuity API probe.
  #
  CC="${CC}" \
  CFLAGS="${CFLAGS}" \
  LDFLAGS="${LDFLAGS} -Wl,-rpath -Wl,/$SB_PREFIX_CLEAN/lib/" \
  PKG_CONFIG_DEFAULT_PATH=${PKG_CONFIG_PATH} \
  PKG_CONFIG_PATH=$SYSROOT/lib/%{_host}/pkgconfig:$SYSROOT/lib/pkgconfig:$SYSROOT/lib64/pkgconfig \
  PKG_CONFIG_BUILD_TOP_DIR=$SB_TMPROOT \
  %{_library_path}=$SYSROOT/lib:$SYSROOT/lib64 \
  %{_ld_library_path}=$SYSROOT/lib:$SYSROOT/lib64 \
  %{__make} %{?_smp_mflags} -C plugin QEMU_PLUGIN_H="${qemu_plugin_h}"

  cd ${build_top}

%install
  build_top=$(pwd)

  %{__rmdir} $SB_BUILD_ROOT

  cd tcgcov-%{tcgcov_version}

  #
  # The plugin is a module QEMU dlopen's, it is not a library anything links
  # to, and it is not a program anything execs, so it is not a candidate for
  # 'lib' or 'libexec' directly. It is given a private directory under 'lib'
  # which is also the search path of the pure python host side package.
  #
  %{__mkdir_p} $SB_BUILD_ROOT%{_libdir}/tcgcov
%ifos darwin
  %{__install} -m 755 plugin/libtcgcov.dylib $SB_BUILD_ROOT%{_libdir}/tcgcov
%else
  %{__install} -m 755 plugin/libtcgcov.so $SB_BUILD_ROOT%{_libdir}/tcgcov
%endif

  #
  # The plugin only writes a '.cov' artifact, the host side python package is
  # what reads it, so both halves are needed. The RSB has no precedent for
  # installing a python package and pip is not a build dependency of the RSB,
  # so the package, which is pure python with no dependencies, is copied into
  # place and the 'tcgcov' console script of the pyproject.toml is provided by
  # a wrapper. This avoids needing a network or a build backend at install.
  #
  %{__cp} -r tcgcov $SB_BUILD_ROOT%{_libdir}/tcgcov/tcgcov

  #
  # The package is not installed to a site-packages directory so the wrapper
  # resolves the path relative to itself and the prefix stays relocatable.
  #
  # The config parser strips a script line from its first hash character to
  # the end of the line, so the hash bang cannot be written literally here
  # and is emitted as an octal escape instead.
  #
  %{__mkdir_p} $SB_BUILD_ROOT%{_bindir}
  printf '\043! /bin/sh\n' > $SB_BUILD_ROOT%{_bindir}/tcgcov
  cat << 'EOF' >> $SB_BUILD_ROOT%{_bindir}/tcgcov
prefix=$(cd "$(dirname "$0")/.." > /dev/null 2>&1 && pwd)
PYTHONPATH="${prefix}/%{_lib}/tcgcov${PYTHONPATH:+:${PYTHONPATH}}"
export PYTHONPATH
exec "${TCGCOV_PYTHON:-python3}" -m tcgcov "$@"
EOF
  %{__chmod} +x $SB_BUILD_ROOT%{_bindir}/tcgcov

  cd ${build_top}
