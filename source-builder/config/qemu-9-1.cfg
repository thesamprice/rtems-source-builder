#
# QEMU 9 Version 1.
#
# This configuration file configure's, make's and install's QEMU.
#

#
# TCG plugins are enabled here and not in qemu-common-2.cfg because that file
# is also included by qemu-5-1.cfg, and the plugin API of QEMU 5 is too old
# for the plugins we care about. QEMU 9 also installs qemu-plugin.h which
# lets a plugin such as tcgcov be built outside the QEMU source tree.
#
%define qemu_disables --disable-nettle --disable-spice --enable-slirp --enable-pixman --disable-download --enable-plugins

%include %{_configdir}/qemu-common-2.cfg
